<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandarin Flashcard Automaton</title>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --card-bg: #252538;
            --text-main: #cdd6f4;
            --text-pinyin: #f5e0dc;
            --text-translation: #a6e3a1;
            --btn-bg: #45475a;
            --btn-hover: #585b70;
            --btn-action: #89b4fa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        #flashcard {
            background-color: var(--card-bg);
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            text-align: center;
            min-width: 450px;
            max-width: 650px;
            margin-bottom: 2rem;
        }

        #hanzi-text {
            font-size: 3rem;
            margin: 0 0 1rem 0;
            font-weight: bold;
        }

        #pinyin-text {
            font-size: 1.8rem;
            color: var(--text-pinyin);
            margin: 0 0 1.5rem 0;
            min-height: 2.5rem;
        }

        #english-text {
            font-size: 1.5rem;
            color: var(--text-translation);
            margin: 1.5rem 0 0 0;
            min-height: 2rem;
            font-style: italic;
        }

        #controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background-color: var(--btn-bg);
            color: var(--text-main);
            border: none;
            padding: 0.8rem 1.8rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background-color: var(--btn-hover);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #btn-reveal {
            background-color: var(--btn-action);
            color: #11111b;
        }
        #btn-reveal:hover {
            background-color: #b4befe;
        }

        #btn-exit {
            background-color: #f38ba8;
            color: #11111b;
        }
        #btn-exit:hover {
            background-color: #eba0b3;
        }
    </style>
</head>
<body>

<div id="flashcard" class="card">
    <!-- Front/Back structural components collapsed into a scannable uniform display -->
    <h1 id="hanzi-text">--</h1>
    <p id="pinyin-text">--</p>
    <p id="english-text">--</p>
</div>

<div id="controls">
    <button id="btn-reveal">Show Meaning</button>
    <button id="btn-repeat">Repeat Audio</button>
    <button id="btn-next">Next Card</button>
    <button id="btn-exit">Exit</button>
</div>

<script>
let flashcards = [];
let currentIndex = 0;
let currentAudio = null;

// 1. Fetch the master JSON populated by your Python script
async function initApp() {
    try {
        const response = await fetch('mandarin_flashcards.json');
        flashcards = await response.json();
        
        if (flashcards.length > 0) {
            showCard(currentIndex);
        } else {
            console.error("Flashcard deck is empty.");
        }
    } catch (error) {
        console.error("Failed to load flashcard data:", error);
    }
}

// 2. Render the flashcard elements to the screen safely
function showCard(index) {
    const card = flashcards[index];
    
    // Core structural target correction applied below
    document.getElementById('hanzi-text').innerText = card.hanzi;
    document.getElementById('pinyin-text').innerText = card.pinyin;
    document.getElementById('english-text').innerText = card.english;
    
    // Hide the meaning elements at first glance
    document.getElementById('pinyin-text').style.visibility = 'hidden';
    document.getElementById('english-text').style.visibility = 'hidden';
    
    // Pre-load the corresponding audio file path mapping
    if (card.audio_src) {
        currentAudio = new Audio(card.audio_src);
        document.getElementById('btn-repeat').disabled = false;
    } else {
        currentAudio = null;
        document.getElementById('btn-repeat').disabled = true;
    }
}

// 3. Audio runtime execute engine
function playAudio() {
    if (currentAudio) {
        currentAudio.currentTime = 0; 
        currentAudio.play().catch(err => console.log("Audio play blocked until interaction:", err));
    }
}

// --- CONTROLS EVENT LISTENERS ---

// Reveal Meaning Button
document.getElementById('btn-reveal').addEventListener('click', () => {
    document.getElementById('pinyin-text').style.visibility = 'visible';
    document.getElementById('english-text').style.visibility = 'visible';
    playAudio();
});

// Repeat Audio Button
document.getElementById('btn-repeat').addEventListener('click', () => {
    playAudio();
});

// Next Card Button
document.getElementById('btn-next').addEventListener('click', () => {
    if (flashcards.length === 0) return;
    
    currentIndex = (currentIndex + 1) % flashcards.length;
    showCard(currentIndex);
});

// Exit Button
document.getElementById('btn-exit').addEventListener('click', () => {
    alert("Session completed! Great work.");
    window.location.reload(); 
});

// Kick off app loop execution
initApp();
</script>

</body>
</html>
